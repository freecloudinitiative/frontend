# Repository identity is supplied by CI so this file can be reused across the organization.
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx,src/**/__tests__/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.d.ts
sonar.coverage.exclusions=src/**/*.test.ts,src/**/*.test.tsx,src/**/__tests__/**,src/test/**,src/mocks/**,**/*.config.ts
sonar.cpd.exclusions=src/**/*.test.ts,src/**/*.test.tsx,src/**/__tests__/**,src/mocks/**

sonar.qualitygate.wait=true
sonar.qualitygate.timeout=600
