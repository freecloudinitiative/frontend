<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Free Cloud Initiative</title>
    <script src="/config.js"></script>
    <script src="/theme-init.js"></script>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background-color: #000000;
        color: #dcdcdc;
      }
      html[data-theme='default'] { background-color: #000000; color: #dcdcdc; }
      html[data-theme='mono'] { background-color: #000000; color: #ffffff; }
      html[data-theme='navy'] { background-color: #0a0e1a; color: #ccd2e0; }
      html[data-theme='beige'] { background-color: #ece0c8; color: #2b2013; }
      html[data-theme='sketch'] { background-color: #ffffff; color: #1a1a1a; }
      body {
        background-color: inherit;
        color: inherit;
      }
      #root {
        background-color: inherit;
        color: inherit;
        min-height: 100vh;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
