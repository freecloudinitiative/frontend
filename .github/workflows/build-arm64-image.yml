---
name: build-arm64-image

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-arm64-image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build and push the linux/arm64 image to the internal registry.
  #
  # Only runs on manual trigger (workflow_dispatch) — never on pull-request builds.
  # A PR from a fork must not be able to trigger a push using repository
  # secrets, and pushing on every PR commit would flood the registry with
  # throwaway tags.
  #
  # The reusable workflow is pinned to an immutable commit SHA, not the
  # mutable v0.1.0 tag. Update the SHA deliberately when upgrading platform-common.
  #   SHA resolved from: refs/tags/v0.1.0
  #
  # Runner label: The registry is hosted on the project LAN and is not
  # reachable from GitHub-hosted runners. The self-hosted runner must be:
  #   - Running on the same LAN segment as the registry.
  #   - Labelled [self-hosted, linux, arm64] in GitHub's runner settings.
  build-and-push:
    uses: freecloudinitiative/platform-common/.github/workflows/build-arm64-image.yml@main
    with:
      image-name: frontend
      push: true
    secrets: inherit
