---
name: build-arm64-image

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-arm64-image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build and push arm64 image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130  # v3.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0

      - name: Log in to registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3.4.0
        with:
          registry: ${{ secrets.REGISTRY_HOST }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Derive image tags
        id: tags
        shell: bash
        run: |
          HOST="${{ secrets.REGISTRY_HOST }}"
          NAME="frontend"
          SHA="${GITHUB_SHA::12}"

          if [[ -n "${HOST}" ]]; then
            TAGS="${HOST}/${NAME}:sha-${SHA}"
            if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
              SEMVER="${GITHUB_REF#refs/tags/}"
              TAGS="${TAGS},${HOST}/${NAME}:${SEMVER}"
            fi
          else
            TAGS="${NAME}:sha-${SHA}"
          fi

          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "Resolved tags: ${TAGS}"

      - name: Build and push arm64 image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.16.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          tags: ${{ steps.tags.outputs.tags }}
          push: true
          cache-from: ${{ secrets.REGISTRY_HOST != '' && format('type=registry,ref={0}/frontend:buildcache', secrets.REGISTRY_HOST) || '' }}
          cache-to: ${{ secrets.REGISTRY_HOST != '' && format('type=registry,ref={0}/frontend:buildcache,mode=max', secrets.REGISTRY_HOST) || '' }}
