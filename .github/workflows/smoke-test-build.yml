---
# Smoke-test for the ARM64 container image build.
#
# Exercises the ARM64 Docker build in build-only mode (push: false) on pull
# requests and pushes to main whenever frontend source code, config, or Dockerfile changes.
#
# This ensures that any Dockerfile syntax errors, build failures, or missing
# dependencies are caught in PR checks before code lands in main, without
# requiring registry push credentials.

name: Smoke-test arm64 build

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - package.json
      - package-lock.json
      - tsconfig*.json
      - vite.config.ts
      - nginx.conf
      - Dockerfile
      - .dockerignore
      - .github/workflows/smoke-test-build.yml
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'src/**'
      - 'public/**'
      - package.json
      - package-lock.json
      - tsconfig*.json
      - vite.config.ts
      - nginx.conf
      - Dockerfile
      - .dockerignore
      - .github/workflows/smoke-test-build.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Build arm64 image (no push)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130  # v3.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0

      - name: Build arm64 image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.16.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          push: false
