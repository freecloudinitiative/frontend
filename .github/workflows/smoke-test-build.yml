---
# Smoke-test for the ARM64 container image build.
#
# Exercises the ARM64 Docker build in build-only mode (push: false) on pull
# requests and pushes to main whenever frontend source code, config, or Dockerfile changes.
#
# This ensures that any Dockerfile syntax errors, build failures, or missing
# dependencies are caught in PR checks before code lands in main, without
# requiring registry push credentials.

name: Smoke-test arm64 build

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - package.json
      - package-lock.json
      - tsconfig*.json
      - vite.config.ts
      - nginx.conf
      - Dockerfile
      - .dockerignore
      - .github/workflows/smoke-test-build.yml
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'src/**'
      - 'public/**'
      - package.json
      - package-lock.json
      - tsconfig*.json
      - vite.config.ts
      - nginx.conf
      - Dockerfile
      - .dockerignore
      - .github/workflows/smoke-test-build.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Build arm64 image (no push)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@49ed152c8ecd8274a445494294a282f1b4097486  # v3.3.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2  # v3.10.0

      - name: Build arm64 image
        uses: docker/build-push-action@14487ce63c7a62a4a324b0bfb37086795e31c6c1  # v6.16.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          push: false
