---
name: pr-checker

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - package.json
      - package-lock.json
      - tsconfig*.json
      - vite.config.ts
      - .oxlintrc.json
      - index.html
      - nginx.conf
      - Dockerfile
      - .dockerignore
      - .github/workflows/pr-checker.yml
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'src/**'
      - 'public/**'
      - package.json
      - package-lock.json
      - tsconfig*.json
      - vite.config.ts
      - .oxlintrc.json
      - index.html
      - nginx.conf
      - Dockerfile
      - .dockerignore
      - .github/workflows/pr-checker.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b  # v4.0.3
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter (Oxlint)
        run: npm run lint

      - name: Run TypeScript typecheck and build
        run: npm run build

      - name: Run unit & integration tests
        run: npm test

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130  # v3.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0

      - name: Build arm64 image (smoke test)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.16.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          push: false
