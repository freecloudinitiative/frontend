---
name: pr-checker

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - package.json
      - package-lock.json
      - tsconfig*.json
      - vite.config.ts
      - .oxlintrc.json
      - index.html
      - .github/workflows/pr-checker.yml
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'src/**'
      - 'public/**'
      - package.json
      - package-lock.json
      - tsconfig*.json
      - vite.config.ts
      - .oxlintrc.json
      - index.html
      - .github/workflows/pr-checker.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter (Oxlint)
        run: npm run lint

      - name: Run TypeScript typecheck and build
        run: npm run build

      - name: Run unit & integration tests
        run: npm test
